name: DriftGuard CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 src/ --max-line-length=100 --extend-ignore=E203

      - name: Format check (black)
        run: black --check src/ tests/

      - name: Tests unitaires
        run: pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image API
        run: docker build -t driftguard-api:latest .

      - name: Build de l'image dashboard
        run: docker build -f Dockerfile.dashboard -t driftguard-dashboard:latest .